<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Bela Mini Bot</title>
  <!-- Google Fonts for Anime feel -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <style>
    :root {
      --primary-green: #00ff88;
      --dark-green: #004422;
      --glow-green: rgba(0, 255, 136, 0.6);
      --bg-black: #050a05;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: var(--bg-black);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      color: white;
    }

    /* Animated Matrix/Anime Background */
    #canvas-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.3;
    }

    .container {
      position: relative;
      width: 90%;
      max-width: 400px;
      z-index: 10;
    }

    /* Main UI Card */
    .card {
      background: rgba(0, 20, 10, 0.85);
      border: 2px solid var(--primary-green);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 0 30px var(--glow-green), inset 0 0 15px var(--glow-green);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    /* Anime Girl Silhouette/Icon placeholder */
    .anime-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 15px;
      background: var(--primary-green);
      mask: url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/svgs/solid/user-ninja.svg') no-repeat center;
      -webkit-mask: url('https://raw.githubusercontent.com/FortAwesome/Font-Awesome/6.x/svgs/solid/mask.svg') no-repeat center;
      background-size: contain;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }

    h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--primary-green);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0;
      font-size: 1.5rem;
      text-shadow: 0 0 10px var(--primary-green);
    }

    h6 {
      color: #aaffaa;
      font-weight: 300;
      margin: 5px 0 20px;
      opacity: 0.8;
    }

    .input-wrapper {
      position: relative;
      margin-top: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--primary-green);
      border-radius: 12px;
      color: var(--primary-green);
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
    }

    input::placeholder {
      color: var(--dark-green);
    }

    .btn-submit {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      background: var(--primary-green);
      border: none;
      border-radius: 12px;
      color: black;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      box-shadow: 0 0 15px var(--primary-green);
    }

    .btn-submit:hover {
      background: #fff;
      box-shadow: 0 0 25px #fff;
      transform: translateY(-2px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    #result-area {
      margin-top: 20px;
      min-height: 50px;
    }

    .code-display {
      background: #000;
      padding: 15px;
      border: 1px dashed var(--primary-green);
      border-radius: 10px;
      cursor: pointer;
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
    }

    .status-msg {
      font-size: 0.9rem;
      color: #fff;
    }

    .loading-dots:after {
      content: ' .';
      animation: dots 1s steps(5, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ' .'; }
      40% { content: ' ..'; }
      60% { content: ' ...'; }
      80%, 100% { content: ''; }
    }

    /* Scanline effect */
    .card::before {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 136, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 2;
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="canvas-bg"></canvas>

  <div class="container">
    <div class="card">
      <div class="anime-icon"></div>
      <h3>𝙱𝙴𝙻𝙰 𝙼𝙸𝙽𝙸 𝙱𝙾𝚃</h3>
      <h6>Developed By Fixo Xd</h6>
      
      <div class="input-wrapper">
        <input type="text" id="phoneNumber" placeholder="9470xxxxxxx" maxlength="15">
      </div>

      <button id="btnSubmit" class="btn-submit">Generate Pairing</button>

      <div id="result-area">
        <p class="status-msg" id="statusText">Ready to connect...</p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('btnSubmit');
    const input = document.getElementById('phoneNumber');
    const resultArea = document.getElementById('result-area');
    const statusText = document.getElementById('statusText');

    // Matrix Rain Effect (Green)
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f8';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 50);

    // Form Logic
    btn.addEventListener('click', async () => {
      let num = input.value.replace(/[^0-9]/g, "");
      
      if (!num || num.length < 10) {
        statusText.innerHTML = '<span style="color:#ff4444">⚠ Please enter a valid number</span>';
        return;
      }

      // UI Feedback
      btn.disabled = true;
      btn.innerText = "Processing...";
      statusText.innerHTML = '<span class="loading-dots">Establishing secure link</span>';

      try {
        // Updated the script logic to handle the API call
        const response = await axios.get(`/code?number=${num}`);
        const code = response.data.code;

        if (code) {
          resultArea.innerHTML = `
            <div class="code-display" id="copyBtn">
              <span style="color:#88ff88; font-size:0.8rem; display:block; margin-bottom:5px;">PAIRING CODE</span>
              <span style="font-family:'Orbitron'; font-size:1.5rem; letter-spacing:3px;">${code}</span>
              <span style="color:#fff; font-size:0.7rem; display:block; margin-top:10px;">Click to copy</span>
            </div>
          `;
          
          document.getElementById('copyBtn').addEventListener('click', function() {
            const tempInput = document.createElement('input');
            tempInput.value = code;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            
            const originalHtml = this.innerHTML;
            this.innerHTML = '<span style="color:#fff; font-family:Orbitron; font-size:1.2rem;">COPIED!</span>';
            this.style.borderColor = "#fff";
            setTimeout(() => {
              this.innerHTML = originalHtml;
              this.style.borderColor = "var(--primary-green)";
            }, 2000);
          });
        } else {
          throw new Error("No code received");
        }
      } catch (err) {
        statusText.innerHTML = '<span style="color:#ff4444">Failed to fetch code. Try again.</span>';
      } finally {
        btn.disabled = false;
        btn.innerText = "Generate Pairing";
      }
    });

    // Resize canvas handler
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
